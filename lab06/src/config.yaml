# Lab 6: one config object drives the whole training pipeline (train.py).
# Studies override single keys from the command line, e.g.
#   python src/train.py --set data.batch_size=256 --set run_name=bs256
seed: 42
run_name: baseline

data:
  batch_size: 128
  num_workers: 0
  val_size: 5000          # taken from the official 60k training set (same split as Lab 3)

model:
  name: CNN               # best model from Lab 3 (test accuracy 0.892)

optimizer:
  name: adam              # adam | sgd
  lr: 0.001
  momentum: 0.9           # used by sgd only
  weight_decay: 0.0

scheduler:
  name: none              # none | step | cosine | plateau
  step_size: 3            # step: multiply lr by gamma every step_size epochs
  gamma: 0.5
  patience: 1             # plateau: epochs without val-loss improvement before reducing lr
  factor: 0.5

train:
  epochs: 5
  grad_accum_steps: 1     # >1 emulates a larger batch (batch_size * grad_accum_steps)
  stop_after_epoch: null  # set to an epoch number to simulate an interruption
  resume: false           # continue from the last checkpoint of this run_name

checkpoint:
  dir: checkpoints        # relative to lab06/, git-ignored

mlflow:
  experiment: lab06
  tracking_dir: mlruns    # relative to lab06/, git-ignored (view with: mlflow ui --backend-store-uri lab06/mlruns)
