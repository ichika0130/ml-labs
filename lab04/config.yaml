# Lab 4 pipeline configuration. Every run of src/pipeline.py reads this file,
# and a copy is stored next to the dataset hashes in results/dataset_manifest.yaml.
seed: 42

dataset:
  source: openml            # sklearn.datasets.fetch_openml
  name: adult
  version: 2
  expected_rows: 48842
  expected_columns: 15
  target_column: class      # OpenML name of the label; called "income" in the manual
  positive_label: ">50K"

schema:
  types:
    age: int
    workclass: category
    fnlwgt: int
    education: category
    education-num: int
    marital-status: category
    occupation: category
    relationship: category
    race: category
    sex: category
    capital-gain: int
    capital-loss: int
    hours-per-week: int
    native-country: category
    class: category
  ranges:                   # inclusive
    age: [17, 90]
    hours-per-week: [1, 99]
    capital-gain: [0, 99999]
    capital-loss: [0, 4356]
  missing_token: "?"        # '?' means missing; NaN is treated the same way

split:
  test_size: 0.3
  stratify: true

cleaning:
  numeric_impute: median
  categorical_impute: most_frequent
  clip_percentiles: [1, 99] # learned from the training split only
  drop_train_duplicates: true

features:
  age_offset: 16            # hours_per_age = hours-per-week / (age - 16); min age is 17

baseline:
  model: LogisticRegression
  max_iter: 1000

label_audit:
  sample_size: 50
